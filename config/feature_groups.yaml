# Feature Group Definitions

# Feature groups for incremental ablation (M0 -> M1 -> M2)
groups:
  # M0: Policy-centric features
  M0:
    - "policy_statement_count"
    - "policy_action_count"
    - "policy_resource_count"
    - "policy_has_wildcard_action"
    - "policy_has_wildcard_resource"
    - "policy_has_condition"
    - "policy_has_deny"
    - "policy_version_count"
    - "effective_allowed_action_count"
    - "effective_denied_action_count"
    - "effective_allowed_resource_count"
    - "effective_permission_count"
    - "effective_sensitive_action_count"
    - "effective_permission_expansion"
    - "effective_permission_reduction"

  # M1: Policy + Environment features
  M1:
    - "environment_type"
    - "environment_resource_count"
    - "environment_privileged_role_count"
    - "environment_sensitive_resource_count"
    - "environment_has_admin_role"
    - "environment_has_kms"
    - "environment_has_secrets_manager"
    - "environment_has_ssm"
    - "environment_has_lambda"
    - "environment_has_permissions_boundary"
    - "environment_has_cross_account_trust"
    - "environment_trust_openness"
    - "environment_reachable_privesc_paths"

  # M2: CloudTrail behavioral context features
  M2:
    - "event_count"
    - "preceding_context_count"
    - "following_context_count"
    - "error_count"
    - "unique_event_names"
    - "unique_error_codes"
    - "cloudtrail_window_seconds"
    - "source_novelty"
    - "user_agent_novelty"
    - "mfa_observability"
    - "failed_iam_activity"
    - "recent_assume_role_activity"
    - "role_chain_length"
    - "unusual_sequence"

# Explicitly documented excluded candidate features
excluded_zero_variance:
  policy_default_version: "Zero variance: constant across all 534 samples (all v1)"
  time_deviation: "Zero variance: constant observation status across all samples"
  first_time_action: "Zero variance: constant value 0/False across all samples"
  actor_deviation: "Zero variance: constant value 0/False across all samples"

# Strictly forbidden fields (metadata, provenance, identifiers, target leakage)
forbidden:
  - "sample_id"
  - "experiment_id"
  - "scenario_id"
  - "scenario_family"
  - "policy_template_id"
